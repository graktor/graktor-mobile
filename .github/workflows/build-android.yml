name: Build Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build-android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: npm install
        working-directory: android
        run: npm install

      - name: Sync Capacitor
        working-directory: android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          pip install --quiet boto3
          python3 - <<'PY'
          import boto3, os

          account_id = os.environ["R2_ACCOUNT_ID"]
          bucket = os.environ["R2_BUCKET_NAME"]
          s3 = boto3.client(
              "s3",
              endpoint_url=f"https://{account_id}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto",
          )
          path = "android/android/app/build/outputs/apk/debug/app-debug.apk"
          key = "releases/Graktor-android-debug.apk"
          s3.upload_file(path, bucket, key, ExtraArgs={"ContentType": "application/vnd.android.package-archive"})
          print(f"uploaded {key}")
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          make_latest: true
          files: android/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Also keep as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: graktor-android-debug-apk
          path: android/android/app/build/outputs/apk/debug/app-debug.apk
